name: Release

# Publishes to npm when a GitHub Release is published. Publishing is deliberate
# and tied to a version tag, not fired on every push. Uses npm trusted publishing
# (OIDC): no NPM_TOKEN, no long-lived secrets.
on:
  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # The environment name must match the npm trusted-publisher configuration.
    environment: npm-publish
    permissions:
      # id-token: write lets the runner mint the OIDC token npm exchanges for
      # short-lived publish credentials. contents: read is for checkout.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build from the exact tag the release points at, not a branch head.
          ref: ${{ github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0. The 22 line resolves to
          # the latest 22.x, which clears that comfortably.
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1, and Node 22 bundles npm 10.9.x,
      # which has no OIDC support at all: it never attempts the token exchange
      # and fails with ENEEDAUTH. `pnpm publish` delegates the actual upload to
      # the npm CLI, so npm's version is what governs here, not pnpm's. Pinned
      # to the 11 line rather than latest, because a release pipeline should not
      # pick up a new npm major on its own.
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1

      # Recorded so a future auth failure can be diagnosed from the log alone.
      - name: Record toolchain versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Re-run the core gates: a release must never ship unvalidated code.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # --no-git-checks because we publish from a detached tag checkout, not a
      # branch. --provenance attaches OIDC provenance; npm validates it against
      # the trusted-publisher config (environment + workflow) on the registry.
      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public --provenance
